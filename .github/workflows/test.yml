name: Self-test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./
        with:
          version: cli-v0.21.1
      - name: Verify installed CLI
        shell: pwsh
        env:
          RESULT_VERSION: ${{ steps.setup.outputs.version }}
          RESULT_PATH: ${{ steps.setup.outputs.path }}
        run: |
          if ($env:RESULT_VERSION -ne 'cli-v0.21.1' -or (Get-Command synchestra).Source -ne $env:RESULT_PATH) { throw 'wrong installed binary' }
          $reported = & synchestra --version
          if ($LASTEXITCODE -ne 0 -or $reported -notmatch '(^|[^0-9])0\.21\.1([^0-9]|$)') { throw "wrong binary version: $reported" }
      - name: Test checksum failures
        shell: pwsh
        run: ./test-install.ps1
